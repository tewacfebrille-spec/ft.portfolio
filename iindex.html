    <style>
        /* Custom Styling & Futuristic Glow Effects */
        body {
            background-color: #08080a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);
            transition: all 0.3s ease;
        }

        .gold-border-glow:hover {
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }

        .glass-panel {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Tech grid lines overlay background */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Pulse glowing animation */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4)); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.8)); }
        }

        .animate-pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Float animation for cards */
        @keyframes float-smooth {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: float-smooth 4s ease-in-out infinite;
        }
